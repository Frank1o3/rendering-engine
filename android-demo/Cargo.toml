[package]
    edition="2024"
    name="android-demo"
    version="0.1.0"

[lib]
    crate-type=["cdylib"]

[dependencies]
    anyhow="1.0.104"
    bytemuck={version="1.25.2", features=["derive"]}
    env_logger="0.11.11"
    glam={version="0.33.2", features=["bytemuck"]}
    glow="0.18.0"
    glutin="0.32.3"
    glutin-winit="0.5.0"
    include_dir="0.7.4"
    log="0.4.33"
    raw-window-handle="0.6.2"
    rendering-engine={path="../engine"}
    winit={version="0.30.13", features=["android-native-activity"]}

    [package.metadata.android]
        package="com.frank1o3.renderingengine"

        build_targets=["aarch64-linux-android", "armv7-linux-androideabi"]

        label="Rendering Engine Demo"

        [package.metadata.android.sdk]
            min_sdk_version=24
            target_sdk_version=36
