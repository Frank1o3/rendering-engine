name: Android APK Build

on:
    push:
        branches: ["main"]
    workflow_dispatch:

jobs:
    build-android:
        runs-on: ubuntu-latest

        env:
            ANDROID_NDK_VERSION: 26.3.11579264

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            # -------------------------
            # Install Rust
            # -------------------------
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Add Android targets
              run: |
                  rustup target add aarch64-linux-android
                  rustup target add armv7-linux-androideabi

            # -------------------------
            # Install Android SDK + NDK
            # -------------------------
            - name: Setup Android SDK
              uses: android-actions/setup-android@v3

            - name: Install NDK
              run: |
                  sdkmanager "ndk;$ANDROID_NDK_VERSION"

            - name: Set NDK env
              run: |
                  echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV

            # -------------------------
            # Build Rust (shared lib)
            # -------------------------
            - name: Build Rust for Android (ARM64)
              run: |
                  cargo build --release --target aarch64-linux-android

            - name: Build Rust for Android (ARMv7)
              run: |
                  cargo build --release --target armv7-linux-androideabi

            # -------------------------
            # Copy .so into Android app
            # -------------------------
            - name: Copy libs into Android project
              run: |
                  mkdir -p android/app/src/main/jniLibs/arm64-v8a
                  mkdir -p android/app/src/main/jniLibs/armeabi-v7a

                  cp target/aarch64-linux-android/release/libandroid_demo.so.so \
                     android/app/src/main/jniLibs/arm64-v8a/

                  cp target/armv7-linux-androideabi/release/libandroid_demo.so.so \
                     android/app/src/main/jniLibs/armeabi-v7a/

            # -------------------------
            # Build APK (uses YOUR app)
            # -------------------------
            - name: Build APK with Gradle
              run: |
                  cd android
                  chmod +x gradlew
                  ./gradlew assembleDebug

            # -------------------------
            # Upload APK
            # -------------------------
            - name: Upload APK
              uses: actions/upload-artifact@v4
              with:
                  name: app-debug
                  path: android/app/build/outputs/apk/debug/*.apk
