name: Build Release

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: android
                    - os: windows-latest
                      target: windows
                    - os: macos-latest
                      target: macos-desktop
                    - os: macos-latest
                      target: ios

        runs-on: ${{ matrix.os }}

        env:
            ANDROID_NDK_VERSION: 26.3.11579264

        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable

            ####################################################################
            # Android
            ####################################################################

            - name: Add Android targets
              if: matrix.target == 'android'
              run: |
                  rustup target add aarch64-linux-android
                  rustup target add armv7-linux-androideabi

            - uses: android-actions/setup-android@v4
              if: matrix.target == 'android'

            - name: Install Android NDK
              if: matrix.target == 'android'
              run: sdkmanager "ndk;$ANDROID_NDK_VERSION"

            - name: Configure NDK
              if: matrix.target == 'android'
              shell: bash
              run: |
                  echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV
                  echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV

            - name: Restore Android keystore
              if: matrix.target == 'android'
              shell: bash
              env:
                  ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
              run: |
                  mkdir -p keys
                  printf '%s' "$ANDROID_UPLOAD_KEYSTORE" | base64 --decode > keys/upload-keystore.jks

            - name: Install cargo-apk
              if: matrix.target == 'android'
              run: cargo install cargo-apk

            - name: Build Android APK
              if: matrix.target == 'android'
              env:
                  CARGO_APK_RELEASE_KEYSTORE: ${{ github.workspace }}/keys/upload-keystore.jks
                  CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CARGO_APK_RELEASE_KEYSTORE_PASSWORD }}
                  CARGO_APK_RELEASE_KEY_PASSWORD: ${{ secrets.CARGO_APK_RELEASE_KEY_PASSWORD }}
              run: cargo apk build --release -p demo --lib

            - name: Upload Android Artifact
              if: matrix.target == 'android'
              uses: actions/upload-artifact@v7
              with:
                  name: android-apk
                  path: target/release/apk/demo.apk

            ####################################################################
            # Windows
            ####################################################################

            - name: Build Windows Desktop
              if: matrix.target == 'windows'
              run: cargo build --release -p demo --bin desktop

            - name: Upload Windows Artifact
              if: matrix.target == 'windows'
              uses: actions/upload-artifact@v7
              with:
                  name: windows-desktop
                  path: target/release/desktop.exe

            ####################################################################
            # macOS
            ####################################################################

            - name: Build macOS Desktop Binary
              if: matrix.target == 'macos-desktop'
              run: cargo build --release -p demo --bin desktop

            - name: Package macOS App Bundle
              if: matrix.target == 'macos-desktop'
              run: |
                  mkdir -p target/release/mac-bundle/RenderingEngineDemo.app/Contents/MacOS

                  cp target/release/desktop \
                     target/release/mac-bundle/RenderingEngineDemo.app/Contents/MacOS/desktop

                  cp demo/apple/mac_desktop/Info.plist \
                     target/release/mac-bundle/RenderingEngineDemo.app/Contents/Info.plist

                  cd target/release/mac-bundle
                  zip -r ../../../RenderingEngineDemo-macOS.zip RenderingEngineDemo.app

            - name: Upload macOS Artifact
              if: matrix.target == 'macos-desktop'
              uses: actions/upload-artifact@v7
              with:
                  name: macos-desktop
                  path: RenderingEngineDemo-macOS.zip

            ####################################################################
            # iOS
            ####################################################################

            - name: Add iOS Targets
              if: matrix.target == 'ios'
              run: |
                  rustup target add aarch64-apple-ios
                  rustup target add aarch64-apple-ios-sim

            - name: Install cargo-mobile2
              if: matrix.target == 'ios'
              run: cargo install cargo-mobile2

            - name: Build iOS
              if: matrix.target == 'ios'
              run: |
                  cd demo
                  cargo apple build --release

            - name: Package iOS Build
              if: matrix.target == 'ios'
              shell: bash
              run: |
                  mkdir ios-package
                  APP=$(find target -type d -name "*.app" | head -n1)

                  if [ -z "$APP" ]; then
                      echo "No .app bundle produced."
                      exit 1
                  fi

                  cp -R "$APP" ios-package/

                  cd ios-package
                  zip -r ../RenderingEngineDemo-iOS.zip .

            - name: Upload iOS Artifact
              if: matrix.target == 'ios'
              uses: actions/upload-artifact@v7
              with:
                  name: ios-app
                  path: RenderingEngineDemo-iOS.zip

    release:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/download-artifact@v8
              with:
                  path: artifacts

            - uses: softprops/action-gh-release@v3
              with:
                  tag_name: beta-${{ github.run_number }}
                  name: Beta Build ${{ github.run_number }}
                  prerelease: true
                  generate_release_notes: true
                  files: |
                      artifacts/android-apk/*.apk
                      artifacts/windows-desktop/desktop.exe
                      artifacts/macos-desktop/RenderingEngineDemo-macOS.zip
                      artifacts/ios-app/RenderingEngineDemo-iOS.zip
