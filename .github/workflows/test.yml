name: Test

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Restore Android keystore
              shell: bash
              env:
                  ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
              run: |
                  mkdir -p keys
                  printf '%s' "$ANDROID_UPLOAD_KEYSTORE" | base64 --decode > keys/upload-keystore.jks

            - name: Load Android keystore password
              shell: bash
              env:
                  CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CARGO_APK_RELEASE_KEYSTORE_PASSWORD }}
              run: |
                  echo "Keystore password length: ${#CARGO_APK_RELEASE_KEYSTORE_PASSWORD}"

            - name: Validate Android keystore
              shell: bash
              env:
                  CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CARGO_APK_RELEASE_KEYSTORE_PASSWORD }}
              run: |
                  keytool -list \
                    -keystore keys/upload-keystore.jks \
                    -storepass "$CARGO_APK_RELEASE_KEYSTORE_PASSWORD"
