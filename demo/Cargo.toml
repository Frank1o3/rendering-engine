[package]
    edition.workspace=true
    license.workspace=true
    name="demo"
    version="0.1.2"

    [package.metadata.android]
        build_targets=["aarch64-linux-android", "armv7-linux-androideabi"]
        label="Rendering Engine Demo"
        package="com.frank1o3.renderingengine"

        [package.metadata.android.sdk]
            min_sdk_version=24
            target_sdk_version=36

        [package.metadata.android.signing.release]
            key_alias="upload"
            key_password="ENV_KEY_PASSWORD"
            keystore_password="ENV_KEYSTORE_PASSWORD"
            path="../keys/upload-keystore.jks"

[lib]
    crate-type=["cdylib", "rlib"]

[[bin]]
    name="desktop"
    path="src/bin/desktop.rs"

[dependencies]
    anyhow.workspace=true
    bytemuck.workspace=true
    env_logger="0.11.11"
    fastnoise-lite="1.1.1"
    glam.workspace=true
    glow.workspace=true
    glutin="0.32.3"
    glutin-winit="0.5.0"
    include_dir.workspace=true
    log.workspace=true
    rand="0.10.2"
    raw-window-handle="0.6.2"
    rendering-engine={path="../engine"}
    serde={version="1.0.229", features=["derive"]}
    serde_json="1.0.151"

[target.'cfg(not(target_os = "android"))'.dependencies]
    winit="0.30.13"

[target.'cfg(target_os = "android")'.dependencies]
    winit={version="0.30.13", features=["android-native-activity"]}
